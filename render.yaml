# Render Blueprint: one web service serves both the API and the UI (the app is a single Node process).
services:
  - type: web
    name: salesdesk
    runtime: node
    plan: free                 # free = disk is wiped on each deploy/restart; see README for a persistent disk
    buildCommand: "echo no build step"
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SEED_SAMPLES      # load the two sample deliveries when the store is empty
        value: "1"
      - key: STATE_FILE
        value: /var/data/state.json   # only used if you attach a disk mounted at /var/data (paid plans)
